openapi: 3.0.3
info:
  title: Acceptance Criteria Management API
  description: >-
    A reference API design for managing acceptance criteria, user stories, and
    BDD scenarios. This specification models the common data structures and
    operations found across acceptance criteria management tools including
    Jira, GitHub Issues, Azure DevOps, and TestRail. It can serve as a
    canonical schema reference for integrating acceptance criteria data across
    multiple systems.
  version: 1.0.0
  contact:
    name: API Evangelist
    url: https://apievangelist.com
    email: kin@apievangelist.com
  license:
    name: Creative Commons Attribution 4.0
    url: https://creativecommons.org/licenses/by/4.0/
externalDocs:
  description: Agile Alliance Acceptance Criteria Glossary
  url: https://www.agilealliance.org/glossary/acceptance-criteria/
servers:
  - url: https://api.example.com/v1
    description: Reference implementation server
security:
  - bearerAuth: []
paths:
  /stories:
    get:
      operationId: listUserStories
      summary: List user stories
      description: Returns a paginated list of user stories with their associated acceptance criteria
      tags:
        - User Stories
      parameters:
        - name: status
          in: query
          description: Filter by story status
          schema:
            type: string
            enum: [backlog, in-progress, ready-for-review, done]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated list of user stories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStoryList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createUserStory
      summary: Create a user story
      description: Creates a new user story with optional acceptance criteria
      tags:
        - User Stories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserStoryRequest'
      responses:
        '201':
          description: User story created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /stories/{storyId}:
    get:
      operationId: getUserStory
      summary: Get a user story
      description: Returns a specific user story with all its acceptance criteria
      tags:
        - User Stories
      parameters:
        - name: storyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User story details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: updateUserStory
      summary: Update a user story
      description: Updates a user story including its acceptance criteria
      tags:
        - User Stories
      parameters:
        - name: storyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStoryRequest'
      responses:
        '200':
          description: Updated user story
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /stories/{storyId}/acceptance-criteria:
    get:
      operationId: listAcceptanceCriteria
      summary: List acceptance criteria for a story
      description: Returns all acceptance criteria items for a user story
      tags:
        - Acceptance Criteria
      parameters:
        - name: storyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of acceptance criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptanceCriteriaList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: addAcceptanceCriterion
      summary: Add acceptance criterion
      description: Adds a new acceptance criterion to a user story
      tags:
        - Acceptance Criteria
      parameters:
        - name: storyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAcceptanceCriterionRequest'
      responses:
        '201':
          description: Acceptance criterion added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptanceCriterion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /stories/{storyId}/acceptance-criteria/{criterionId}:
    put:
      operationId: updateAcceptanceCriterion
      summary: Update an acceptance criterion
      description: Updates the text or status of an acceptance criterion
      tags:
        - Acceptance Criteria
      parameters:
        - name: storyId
          in: path
          required: true
          schema:
            type: string
        - name: criterionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAcceptanceCriterionRequest'
      responses:
        '200':
          description: Updated acceptance criterion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptanceCriterion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteAcceptanceCriterion
      summary: Delete an acceptance criterion
      description: Removes an acceptance criterion from a user story
      tags:
        - Acceptance Criteria
      parameters:
        - name: storyId
          in: path
          required: true
          schema:
            type: string
        - name: criterionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Acceptance criterion deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scenarios:
    get:
      operationId: listScenarios
      summary: List BDD scenarios
      description: Returns a list of Gherkin BDD scenarios derived from acceptance criteria
      tags:
        - BDD Scenarios
      parameters:
        - name: storyId
          in: query
          description: Filter scenarios by parent user story
          schema:
            type: string
        - name: status
          in: query
          description: Filter by scenario test status
          schema:
            type: string
            enum: [pending, passing, failing, skipped]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of BDD scenarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createScenario
      summary: Create a BDD scenario
      description: Creates a new Gherkin BDD scenario linked to an acceptance criterion
      tags:
        - BDD Scenarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScenarioRequest'
      responses:
        '201':
          description: Scenario created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /test-runs:
    get:
      operationId: listTestRuns
      summary: List acceptance test runs
      description: Returns a list of acceptance test run executions with pass/fail results
      tags:
        - Test Runs
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of test runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRunList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createTestRun
      summary: Create a test run
      description: Triggers execution of acceptance criteria tests for a story or set of scenarios
      tags:
        - Test Runs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTestRunRequest'
      responses:
        '201':
          description: Test run created and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    UserStory:
      type: object
      description: A user story representing a feature or requirement from the perspective of an end user
      required: [id, title, status]
      properties:
        id:
          type: string
          description: Unique identifier for the user story
        title:
          type: string
          description: Short title summarizing the user story (As a... I want... So that...)
        description:
          type: string
          description: Full user story narrative including role, goal, and benefit
        status:
          type: string
          description: Current lifecycle status of the user story
          enum: [backlog, in-progress, ready-for-review, done]
        priority:
          type: string
          description: Priority level of the user story
          enum: [low, medium, high, critical]
        storyPoints:
          type: integer
          description: Effort estimate in story points
        acceptanceCriteria:
          type: array
          description: List of acceptance criteria that define done for this story
          items:
            $ref: '#/components/schemas/AcceptanceCriterion'
        tags:
          type: array
          description: Labels or tags associated with the story
          items:
            type: string
        assignee:
          type: string
          description: Username or ID of the person assigned to this story
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the user story was created
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the user story was last updated
    UserStoryList:
      type: object
      description: Paginated list of user stories
      properties:
        total:
          type: integer
          description: Total number of user stories matching the query
        page:
          type: integer
          description: Current page number
        pageSize:
          type: integer
          description: Number of items per page
        stories:
          type: array
          description: Array of user story objects
          items:
            $ref: '#/components/schemas/UserStory'
    CreateUserStoryRequest:
      type: object
      description: Request body for creating a new user story
      required: [title]
      properties:
        title:
          type: string
          description: Short title for the user story
        description:
          type: string
          description: Full user story narrative
        priority:
          type: string
          description: Priority level
          enum: [low, medium, high, critical]
        storyPoints:
          type: integer
          description: Effort estimate in story points
        tags:
          type: array
          description: Labels or tags
          items:
            type: string
        assignee:
          type: string
          description: Assignee username or ID
    UpdateUserStoryRequest:
      type: object
      description: Request body for updating an existing user story
      properties:
        title:
          type: string
          description: Updated title
        description:
          type: string
          description: Updated description
        status:
          type: string
          description: Updated status
          enum: [backlog, in-progress, ready-for-review, done]
        priority:
          type: string
          description: Updated priority
          enum: [low, medium, high, critical]
        storyPoints:
          type: integer
          description: Updated story point estimate
    AcceptanceCriterion:
      type: object
      description: A single testable condition that must be met for a user story to be accepted as complete
      required: [id, description]
      properties:
        id:
          type: string
          description: Unique identifier for the acceptance criterion
        storyId:
          type: string
          description: ID of the parent user story
        description:
          type: string
          description: Plain-language description of the acceptance condition
        format:
          type: string
          description: Format used to express the criterion
          enum: [plain-text, gherkin, checklist]
        given:
          type: string
          description: Gherkin Given clause (context/precondition) if format is gherkin
        when:
          type: string
          description: Gherkin When clause (action/trigger) if format is gherkin
        then:
          type: string
          description: Gherkin Then clause (expected outcome) if format is gherkin
        status:
          type: string
          description: Verification status of this criterion
          enum: [not-verified, passing, failing]
        order:
          type: integer
          description: Display order position within the parent story
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the criterion was created
    AcceptanceCriteriaList:
      type: object
      description: List of acceptance criteria for a user story
      properties:
        total:
          type: integer
          description: Total number of acceptance criteria
        page:
          type: integer
          description: Current page number
        pageSize:
          type: integer
          description: Number of items per page
        criteria:
          type: array
          description: Array of acceptance criteria
          items:
            $ref: '#/components/schemas/AcceptanceCriterion'
    CreateAcceptanceCriterionRequest:
      type: object
      description: Request body for adding an acceptance criterion to a story
      required: [description]
      properties:
        description:
          type: string
          description: Plain-language description of the acceptance condition
        format:
          type: string
          description: Format of the criterion
          enum: [plain-text, gherkin, checklist]
          default: plain-text
        given:
          type: string
          description: Gherkin Given clause
        when:
          type: string
          description: Gherkin When clause
        then:
          type: string
          description: Gherkin Then clause
        order:
          type: integer
          description: Display order position
    UpdateAcceptanceCriterionRequest:
      type: object
      description: Request body for updating an acceptance criterion
      properties:
        description:
          type: string
          description: Updated description
        given:
          type: string
          description: Updated Given clause
        when:
          type: string
          description: Updated When clause
        then:
          type: string
          description: Updated Then clause
        status:
          type: string
          description: Updated verification status
          enum: [not-verified, passing, failing]
        order:
          type: integer
          description: Updated display order
    Scenario:
      type: object
      description: A Gherkin BDD scenario that automates verification of an acceptance criterion
      required: [id, title, featureFile]
      properties:
        id:
          type: string
          description: Unique identifier for the scenario
        storyId:
          type: string
          description: ID of the parent user story
        criterionId:
          type: string
          description: ID of the linked acceptance criterion
        title:
          type: string
          description: Scenario title as it appears in the feature file
        featureFile:
          type: string
          description: Path to the Gherkin feature file containing this scenario
        gherkin:
          type: string
          description: Full Gherkin text of the scenario including Given/When/Then steps
        status:
          type: string
          description: Latest test execution status
          enum: [pending, passing, failing, skipped]
        lastRunAt:
          type: string
          format: date-time
          description: Timestamp of the most recent test execution
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the scenario was created
    ScenarioList:
      type: object
      description: Paginated list of BDD scenarios
      properties:
        total:
          type: integer
          description: Total number of scenarios matching the query
        page:
          type: integer
          description: Current page number
        pageSize:
          type: integer
          description: Number of items per page
        scenarios:
          type: array
          description: Array of scenario objects
          items:
            $ref: '#/components/schemas/Scenario'
    CreateScenarioRequest:
      type: object
      description: Request body for creating a BDD scenario
      required: [storyId, title, featureFile, gherkin]
      properties:
        storyId:
          type: string
          description: ID of the parent user story
        criterionId:
          type: string
          description: ID of the linked acceptance criterion
        title:
          type: string
          description: Scenario title
        featureFile:
          type: string
          description: Feature file path
        gherkin:
          type: string
          description: Full Gherkin scenario text
    TestRun:
      type: object
      description: An execution instance of acceptance criteria tests across one or more stories or scenarios
      required: [id, status]
      properties:
        id:
          type: string
          description: Unique identifier for the test run
        storyIds:
          type: array
          description: User story IDs included in this test run
          items:
            type: string
        scenarioIds:
          type: array
          description: Specific scenario IDs included in this test run
          items:
            type: string
        status:
          type: string
          description: Overall test run status
          enum: [queued, running, passed, failed, cancelled]
        totalScenarios:
          type: integer
          description: Total number of scenarios in this run
        passedScenarios:
          type: integer
          description: Number of scenarios that passed
        failedScenarios:
          type: integer
          description: Number of scenarios that failed
        skippedScenarios:
          type: integer
          description: Number of scenarios that were skipped
        startedAt:
          type: string
          format: date-time
          description: Timestamp when the test run started
        completedAt:
          type: string
          format: date-time
          description: Timestamp when the test run completed
        reportUrl:
          type: string
          description: URL to the detailed test run report
    TestRunList:
      type: object
      description: Paginated list of test runs
      properties:
        total:
          type: integer
          description: Total number of test runs
        page:
          type: integer
          description: Current page number
        pageSize:
          type: integer
          description: Number of items per page
        runs:
          type: array
          description: Array of test run objects
          items:
            $ref: '#/components/schemas/TestRun'
    CreateTestRunRequest:
      type: object
      description: Request body for creating and triggering a test run
      properties:
        storyIds:
          type: array
          description: User story IDs to test (all scenarios for these stories)
          items:
            type: string
        scenarioIds:
          type: array
          description: Specific scenario IDs to execute
          items:
            type: string
    ErrorResponse:
      type: object
      description: Standard error response
      properties:
        code:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable error description
        details:
          type: string
          description: Additional error context or troubleshooting information
