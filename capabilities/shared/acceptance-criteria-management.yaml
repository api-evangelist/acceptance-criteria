apiVersion: naftiko.io/v1alpha1
kind: SharedCapability
metadata:
  name: acceptance-criteria-management
  version: 1.0.0
  description: Shared capability for managing acceptance criteria, user stories, BDD scenarios, and test run execution
  provider: Reference Implementation
  tags:
    - Acceptance Criteria
    - User Stories
    - BDD Scenarios
    - Test Management
    - Agile
spec:
  openapi: openapi/acceptance-criteria-management.yaml
  baseUrl: https://api.example.com/v1
  authentication:
    type: http
    scheme: bearer
  operations:
    - operationId: listUserStories
      summary: List user stories with acceptance criteria
      method: GET
      path: /stories
      tags: [User Stories]
    - operationId: createUserStory
      summary: Create a new user story
      method: POST
      path: /stories
      tags: [User Stories]
    - operationId: getUserStory
      summary: Get a specific user story with all acceptance criteria
      method: GET
      path: /stories/{storyId}
      tags: [User Stories]
    - operationId: listAcceptanceCriteria
      summary: List all acceptance criteria for a user story
      method: GET
      path: /stories/{storyId}/acceptance-criteria
      tags: [Acceptance Criteria]
    - operationId: addAcceptanceCriterion
      summary: Add an acceptance criterion to a user story
      method: POST
      path: /stories/{storyId}/acceptance-criteria
      tags: [Acceptance Criteria]
    - operationId: updateAcceptanceCriterion
      summary: Update an acceptance criterion
      method: PUT
      path: /stories/{storyId}/acceptance-criteria/{criterionId}
      tags: [Acceptance Criteria]
    - operationId: listScenarios
      summary: List Gherkin BDD scenarios
      method: GET
      path: /scenarios
      tags: [BDD Scenarios]
    - operationId: createScenario
      summary: Create a BDD scenario
      method: POST
      path: /scenarios
      tags: [BDD Scenarios]
    - operationId: listTestRuns
      summary: List acceptance test run executions
      method: GET
      path: /test-runs
      tags: [Test Runs]
    - operationId: createTestRun
      summary: Trigger an acceptance test run
      method: POST
      path: /test-runs
      tags: [Test Runs]
  schemas:
    - UserStory
    - AcceptanceCriterion
    - AcceptanceCriteriaList
    - Scenario
    - ScenarioList
    - TestRun
    - TestRunList
