naftiko: 1.0.0-alpha2
info:
  label: Acceptance Criteria Management API — User Stories
  description: 'Acceptance Criteria Management API — User Stories. 4 operations. Lead operation: List user stories. Self-contained
    Naftiko capability covering one Acceptance Criteria business surface.'
  tags:
  - Acceptance Criteria
  - User Stories
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ACCEPTANCE_CRITERIA_API_KEY: ACCEPTANCE_CRITERIA_API_KEY
capability:
  consumes:
  - type: http
    namespace: management-user-stories
    baseUri: https://api.example.com/v1
    description: Acceptance Criteria Management API — User Stories business capability. Self-contained, no shared references.
    resources:
    - name: stories
      path: /stories
      operations:
      - name: listuserstories
        method: GET
        description: List user stories
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
          description: Filter by story status
        - name: page
          in: query
          type: integer
        - name: pageSize
          in: query
          type: integer
      - name: createuserstory
        method: POST
        description: Create a user story
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: stories-storyId
      path: /stories/{storyId}
      operations:
      - name: getuserstory
        method: GET
        description: Get a user story
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: storyId
          in: path
          type: string
          required: true
      - name: updateuserstory
        method: PUT
        description: Update a user story
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: storyId
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.ACCEPTANCE_CRITERIA_API_KEY}}'
  exposes:
  - type: rest
    namespace: management-user-stories-rest
    port: 8080
    description: REST adapter for Acceptance Criteria Management API — User Stories. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/stories
      name: stories
      description: REST surface for stories.
      operations:
      - method: GET
        name: listuserstories
        description: List user stories
        call: management-user-stories.listuserstories
        with:
          status: rest.status
          page: rest.page
          pageSize: rest.pageSize
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createuserstory
        description: Create a user story
        call: management-user-stories.createuserstory
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/stories/{storyid}
      name: stories-storyid
      description: REST surface for stories-storyId.
      operations:
      - method: GET
        name: getuserstory
        description: Get a user story
        call: management-user-stories.getuserstory
        with:
          storyId: rest.storyId
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateuserstory
        description: Update a user story
        call: management-user-stories.updateuserstory
        with:
          storyId: rest.storyId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: management-user-stories-mcp
    port: 9090
    transport: http
    description: MCP adapter for Acceptance Criteria Management API — User Stories. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: list-user-stories
      description: List user stories
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-user-stories.listuserstories
      with:
        status: tools.status
        page: tools.page
        pageSize: tools.pageSize
      outputParameters:
      - type: object
        mapping: $.
    - name: create-user-story
      description: Create a user story
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: management-user-stories.createuserstory
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-user-story
      description: Get a user story
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-user-stories.getuserstory
      with:
        storyId: tools.storyId
      outputParameters:
      - type: object
        mapping: $.
    - name: update-user-story
      description: Update a user story
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: management-user-stories.updateuserstory
      with:
        storyId: tools.storyId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
